<!--
  SOC Home Lab - centralized Wazuh agent configuration
  Location on manager: /var/ossec/etc/shared/default/agent.conf
-->
<agent_config os="Windows">

  <!-- ===== Event channels ===== -->
  <localfile>
    <location>Microsoft-Windows-Sysmon/Operational</location>
    <log_format>eventchannel</log_format>
  </localfile>

  <localfile>
    <location>Microsoft-Windows-PowerShell/Operational</location>
    <log_format>eventchannel</log_format>
  </localfile>

  <localfile>
    <location>Windows PowerShell</location>
    <log_format>eventchannel</log_format>
  </localfile>

  <localfile>
    <location>Microsoft-Windows-TaskScheduler/Operational</location>
    <log_format>eventchannel</log_format>
  </localfile>

  <localfile>
    <location>Microsoft-Windows-Windows Defender/Operational</location>
    <log_format>eventchannel</log_format>
  </localfile>

  <!-- ===== File Integrity Monitoring ===== -->
  <syscheck>
    <directories check_all="yes" whodata="yes" report_changes="yes">C:\LabData</directories>
    <directories check_all="yes" realtime="yes">C:\ProgramData\Microsoft\Windows\Start Menu\Programs\Startup</directories>
    <directories check_all="yes" realtime="yes">C:\Users\Public</directories>
  </syscheck>

</agent_config>
